 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:inherit}
html{height:100%}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:12px 0 6px}

.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--urgent);color:#fff;font-size:12px;line-height:20px;margin-left:4px}
main{padding:14px 0}
.notice{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:14px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
h2{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--muted)}

.del{background:none;border:0;color:var(--danger);font-size:14px;padding:6px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}

.manual{width:100%;font-size:22px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin:8px 0 14px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}.toast.show{opacity:1}
#nameDlg{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}#nameDlg.open{display:flex}
#nameDlg .card{width:100%;max-width:380px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="nameDlg"><div class="card">
  <h1 style="margin:0 0 6px;font-size:24px">Нарачки</h1>
  <p style="color:var(--muted);margin-top:0">Внеси го твоето име. Ќе стои на нарачките и издавањата.</p>
  <label class="field"><span>Име и презиме</span><input id="nmIn" autocomplete="name"></label>
  <button class="btn" id="nmOk" style="width:100%">Почни</button>
</div></div>

<header><div class="wrap">
  <div class="top"><h1>Нарачки</h1><button class="who" id="who"></button></div>
  <nav role="tablist">
    <button role="tab" data-tab="order" aria-selected="true">Нарачај</button>
    <button role="tab" data-tab="wh" aria-selected="false">Магацин <span id="bNew"></span></button>
    <button role="tab" data-tab="del" aria-selected="false">Испорака <span id="bDel"></span></button>
    <button role="tab" data-tab="rep" aria-selected="false">Извештај</button>
  </nav>
</div></header>
<main class="wrap">
  <div id="banner"></div>
  <section id="tab-order"></section>
  <section id="tab-wh" hidden></section>
  <section id="tab-del" hidden></section>
  <section id="tab-rep" hidden></section>
</main>
<div class="scanbar" id="scanbar"><div class="wrap">
  <button class="btn" id="scanBtn">Скенирај QR</button>
  <button class="btn ghost" id="manualBtn">Внеси шифра</button>
</div></div>
<div class="overlay" id="cam">
  <video id="video" playsinline muted></video><div class="frame"></div>
  <div class="ov-msg" id="camMsg"></div>
  <div id="camInfo" style="position:absolute;right:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));color:#aaa;font-size:11px"></div>
  <div class="ov-bar"><button id="camSwitch" hidden>Камера</button><button id="camTorch" hidden>Светло</button><button id="camZoom" hidden>Зум 2×</button><button id="camPhoto">Сликај</button><button id="camManual">Внеси рачно</button><button id="camClose">Затвори</button></div>
</div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Math.round(n*1000)/1000).toLocaleString("mk-MK");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400)}
const norm=c=>String(c??"").trim().toUpperCase();
const CAT=new Map(Object.entries(DATA.cat).map(([k,v])=>[norm(k),{c:k,n:v[0],nacin:v[1],od:v[2],kon:v[3],unit:v[4]}]));
const SECTORS=Object.keys(DATA.tc);
const S={fs:null,auth:null,uid:null,name:store.get("nar-name")||"",ready:false,online:navigator.onLine,
  tab:"order",sector:store.get("nar-sector")||"",cart:JSON.parse(store.get("nar-cart")||"[]"),urgent:false,note:"",
  orders:[],whFilter:store.get("nar-wh")||"all",repDate:new Date().toISOString().slice(0,10),
  stream:null,scanning:false,liveOk:true,cams:[],track:null,torch:false,zoom:1};
const saveCart=()=>store.set("nar-cart",JSON.stringify(S.cart));

/* firebase */
if(!window.firebase){S.err="Нема врска со Firebase."}
else{
  firebase.initializeApp(FIREBASE_CONFIG); S.auth=firebase.auth(); S.fs=firebase.firestore();
  S.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  S.auth.onAuthStateChanged(u=>{
    if(!u){S.auth.signInAnonymously().catch(()=>{S.err="Не може да се поврзе. Во Firebase вклучи Anonymous.";render()});return}
    S.uid=u.uid; if(!S.name){$("#nameDlg").classList.add("open");setTimeout(()=>$("#nmIn").focus(),100)}
    listen();
  });
}
window.addEventListener("online",()=>{S.online=true;render()});window.addEventListener("offline",()=>{S.online=false;render()});
$("#nmOk").onclick=()=>{const n=$("#nmIn").value.trim();if(!n)return;S.name=n;store.set("nar-name",n);$("#nameDlg").classList.remove("open");render()};
$("#nmIn").onkeydown=e=>{if(e.key==="Enter")$("#nmOk").click()};
$("#who").onclick=()=>{const n=prompt("Твоето име:",S.name);if(n&&n.trim()){S.name=n.trim();store.set("nar-name",S.name);render()}};

let unsub=null;
function listen(){
  if(unsub) unsub();
  const since=Date.now()-14*864e5;
  unsub=S.fs.collection("orders").where("createdAt",">=",since).onSnapshot({includeMetadataChanges:true},snap=>{
    S.orders=snap.docs.map(d=>({id:d.id,pending:d.metadata.hasPendingWrites,...d.data()}));
    S.ready=true; render();
  },err=>{S.ready=true;S.err="Нема пристап до нарачките. Провери ги правилата во Firebase (orders).";render()});
}

/* tabs */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["order","wh","del","rep"].forEach(t=>$("#tab-"+t).hidden=t!==S.tab);render()});

const tStr=t=>t?new Date(t).toLocaleString("mk-MK",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const mins=(a,b)=>a&&b?Math.round((b-a)/60000):null;
const sortOrders=a=>a.sort((x,y)=>(y.urgent?1:0)-(x.urgent?1:0)||(x.createdAt||0)-(y.createdAt||0));

function render(){
  $("#who").textContent=S.name?S.name+" ✎":"";
  let b="";
  if(S.err) b=`<div class="notice">${esc(S.err)}</div>`;
  else if(!S.online) b='<div class="notice">Нема интернет. Нарачките се чуваат на телефонот и ќе се испратат кога ќе се врати врската.</div>';
  $("#banner").innerHTML=b;
  const nNew=S.orders.filter(o=>o.status==="new").length, nIss=S.orders.filter(o=>o.status==="issued").length;
  $("#bNew").innerHTML=nNew?`<span class="badge">${nNew}</span>`:""; $("#bDel").innerHTML=nIss?`<span class="badge" style="background:var(--accent)">${nIss}</span>`:"";
  $("#scanbar").style.display=S.tab==="order"?"":"none";
  ({order:rOrder,wh:rWh,del:rDel,rep:rRep})[S.tab]();
}

/* ---- НАРАЧАЈ ---- */
function rOrder(){
  const el=$("#tab-order");
  const opts=SECTORS.map(s=>`<option${s===S.sector?" selected":""}>${esc(s)}</option>`).join("");
  let h=`<div class="card sector"><div><div class="lbl">Сектор</div><div class="val">${esc(S.sector||"–")}</div></div>
    <select id="secSel" aria-label="Сектор"><option value="">избери…</option>${opts}</select></div>`;
  if(!S.sector) h+=`<div class="empty"><b>Прво скенирај го кодот на секторот</b>Горе десно на таблата, или избери сектор од листата.</div>`;
  else if(!S.cart.length) h+=`<div class="empty"><b>Скенирај артикл што фали</b>Кодот до артиклот на таблата, или етикетата на кутијата.</div>`;
  else{
    h+=`<h2>Нарачка за ${esc(S.sector)} (${S.cart.length})</h2><div class="list">${S.cart.map((l,i)=>`<div class="row"><div class="main"><div class="code">${esc(l.code)}</div><div class="desc">${esc(l.name)}</div><div class="meta">Од ${esc(l.od||"?")}${l.nacin==="Минус"?" · минус":""}</div></div>
      <div class="qty">${fmt(l.qty)} <span class="unit">${esc(l.unit)}</span></div><button class="del" data-i="${i}">Тргни</button></div>`).join("")}</div>
      <div class="card" style="margin-top:12px">
        <label class="toggle"><input type="checkbox" id="urg" ${S.urgent?"checked":""}> Итно</label>
        <label class="field" style="margin-top:10px"><span>Забелешка (не е задолжително)</span><input id="note" value="${esc(S.note)}"></label>
        <div class="btns"><button class="btn" id="send" style="flex:1">Испрати нарачка</button><button class="btn ghost" id="clr">Исчисти</button></div></div>`;
  }
  el.innerHTML=h;
  $("#secSel").onchange=e=>setSector(e.target.value);
  el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.cart.splice(+b.dataset.i,1);saveCart();render()});
  const u=$("#urg"); if(u) u.onchange=()=>S.urgent=u.checked;
  const n=$("#note"); if(n) n.oninput=()=>S.note=n.value;
  const s=$("#send"); if(s) s.onclick=sendOrder;
  const c=$("#clr"); if(c) c.onclick=()=>{if(confirm("Да се исчисти нарачката?")){S.cart=[];saveCart();render()}};
}
function setSector(s){
  if(S.cart.length&&s!==S.sector&&!confirm("Има артикли во нарачката за "+S.sector+". Да се исчисти и да се смени секторот?")){render();return}
  if(s!==S.sector){S.cart=[];saveCart()}
  S.sector=s;store.set("nar-sector",s);render(); if(s) toast("Сектор: "+s);
}
function sendOrder(){
  if(!S.cart.length||!S.sector) return;
  const now=Date.now(); const no=new Date(now).toLocaleDateString("mk-MK",{day:"2-digit",month:"2-digit"}).replace(/\D/g,"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
  const doc={no,sector:S.sector,tc:DATA.tc[S.sector]||"",urgent:!!S.urgent,note:S.note.trim(),
    lines:S.cart.map(l=>({code:l.code,name:l.name,unit:l.unit,qty:l.qty,od:l.od,kon:l.kon,nacin:l.nacin,issued:null})),
    status:"new",createdAt:now,by:S.uid,byName:S.name};
  S.fs.collection("orders").add(doc).catch(()=>toast("Нарачката не е испратена. Пробај пак."));
  S.cart=[];S.urgent=false;S.note="";saveCart();toast("Нарачката "+no+" е испратена");render();
}

/* scan handling */
function onScan(raw){
  const t=String(raw||"").trim();
  const m=t.match(/^SEKTOR:(.+)$/i);
  if(m){const s=m[1].trim(); const k=SECTORS.find(x=>x.toLowerCase()===s.toLowerCase())||s; setSector(k); return}
  if(!S.sector){toast("Прво скенирај го секторот");return}
  let code=null;
  if(CAT.has(norm(t))) code=norm(t); else for(const p of t.split(/[\s|;,\t\n\r]+/)) if(CAT.has(norm(p))){code=norm(p);break}
  showItem(code?CAT.get(code):{c:t,n:"",nacin:"",od:"",kon:"",unit:""},!!code);
}
function openSheet(h){$("#sheet").innerHTML=h;$("#sheetBg").classList.add("open")}
function closeSheet(){$("#sheetBg").classList.remove("open")}
$("#sheetBg").onclick=e=>{if(e.target.id==="sheetBg")closeSheet()};
function showItem(it,known){
  const inCart=S.cart.find(l=>norm(l.code)===norm(it.c));
  const usel=it.unit?`<div class="ubox">${esc(it.unit)}</div>`:`<div class="ubox"><select id="uSel" aria-label="Мерка"><option value="">мерка…</option>${UNITS.map(u=>`<option>${u}</option>`).join("")}</select></div>`;
  openSheet(`<p class="scode">${esc(it.c)}</p><p class="sdesc">${esc(it.n)}${it.od?` · од ${esc(it.od)}`:""}</p>
    ${known?"":`<div class="unknown">Оваа шифра ја нема во шифрарникот. Провери дали е точна; магацинот ќе ја види како непозната.</div>`}
    ${inCart?`<div class="unknown" style="border-color:var(--accent);background:var(--bg)">Веќе е во нарачката: ${fmt(inCart.qty)} ${esc(inCart.unit)}. Новата количина ќе ја замени.</div>`:""}
    <div class="qrow"><input class="bigqty" id="qIn" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Количина">${usel}</div>
    <div class="btns"><button class="btn ghost" id="qX">Откажи</button><button class="btn" id="qOk">Додај</button></div>`);
  const q=$("#qIn"); setTimeout(()=>q.focus(),60);
  const go=()=>{const v=parseFloat(String(q.value).replace(/\s/g,"").replace(",","."));
    if(!isFinite(v)||v<=0){q.focus();toast("Внеси количина");return}
    const unit=it.unit||($("#uSel")&&$("#uSel").value)||""; if(!unit){toast("Избери мерка");return}
    const line={code:it.c,name:it.n,unit,qty:v,od:it.od,kon:it.kon,nacin:it.nacin};
    const i=S.cart.findIndex(l=>norm(l.code)===norm(it.c)); if(i>=0)S.cart[i]=line; else S.cart.push(line);
    saveCart();closeSheet();toast(`${it.c}: ${fmt(v)} ${unit}`);render();if(S.liveOk)setTimeout(startScan,350)};
  $("#qOk").onclick=go;q.onkeydown=e=>{if(e.key==="Enter")go()};$("#qX").onclick=closeSheet;
}
function manualEntry(){
  stopScan();
  openSheet(`<p class="scode" style="font-size:22px">Внеси шифра</p><input class="manual" id="manIn" autocomplete="off" autocapitalize="characters" placeholder="Шифра на артикл">
    <div class="btns"><button class="btn ghost" id="manX">Откажи</button><button class="btn" id="manOk">Продолжи</button></div>`);
  const mi=$("#manIn");setTimeout(()=>mi.focus(),60);
  const go=()=>{const v=mi.value.trim();if(!v)return;closeSheet();setTimeout(()=>onScan(v),60)};
  $("#manOk").onclick=go;mi.onkeydown=e=>{if(e.key==="Enter")go()};$("#manX").onclick=closeSheet;
}
$("#scanBtn").onclick=()=>startScan(); $("#manualBtn").onclick=manualEntry;

/* ---- МАГАЦИН ---- */
function rWh(){
  const el=$("#tab-wh");
  if(!S.ready){el.innerHTML='<div class="empty">Се вчитува…</div>';return}
  const whs=[...new Set(S.orders.filter(o=>o.status==="new").flatMap(o=>o.lines.map(l=>l.od||"?")))].sort();
  let list=sortOrders(S.orders.filter(o=>o.status==="new"));
  const f=S.whFilter; if(f!=="all") list=list.filter(o=>o.lines.some(l=>(l.od||"?")===f));
  let h=`<div class="chips"><button class="chip" data-w="all" aria-pressed="${f==="all"}">Сите магацини</button>${whs.map(w=>`<button class="chip" data-w="${esc(w)}" aria-pressed="${f===w}">${esc(w)}</button>`).join("")}</div>`;
  if(!list.length) h+=`<div class="empty"><b>Нема нови нарачки</b>Новите нарачки се појавуваат тука сами.</div>`;
  for(const o of list){
    const lines=o.lines.map((l,i)=>({...l,i})).filter(l=>f==="all"||(l.od||"?")===f);
    h+=`<div class="order${o.urgent?" urgent":""}" data-o="${o.id}"><div class="ohead"><b>${esc(o.sector)}</b>${o.urgent?'<span class="tag urg">ИТНО</span>':""}<span class="tag">${esc(o.no)}</span>
      <span class="meta">${esc(o.byName||"")}, ${tStr(o.createdAt)}${o.pending?" · чека интернет":""}</span></div>
      ${o.note?`<div class="oline" style="display:block;background:var(--warn-soft)">${esc(o.note)}</div>`:""}
      ${lines.map(l=>`<div class="oline"><div><div class="code">${esc(l.code)} <span class="tag">${esc(l.od||"?")}</span>${l.nacin==="Минус"?'<span class="tag">минус</span>':""}</div><div class="desc">${esc(l.name)}</div>
        <div class="meta">Побарано: <b>${fmt(l.qty)} ${esc(l.unit)}</b></div></div>
        <div class="iss"><input type="text" inputmode="decimal" data-i="${l.i}" value="${l.issued!=null?l.issued:l.qty}" aria-label="Издадено"><span class="unit">${esc(l.unit)}</span></div></div>`).join("")}
      <div class="ofoot"><span class="meta" style="flex:1">Смени ја количината ако издаваш различно. 0 = нема.</span><button class="btn okb" data-issue="${o.id}">Издадено</button></div></div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.whFilter=b.dataset.w;store.set("nar-wh",S.whFilter);render()});
  el.querySelectorAll("[data-issue]").forEach(b=>b.onclick=()=>issue(b.dataset.issue));
}
function issue(id){
  const o=S.orders.find(x=>x.id===id); if(!o) return;
  const box=document.querySelector(`[data-o="${id}"]`);
  const lines=o.lines.map(l=>({...l}));
  let bad=false;
  box.querySelectorAll("input[data-i]").forEach(inp=>{const v=parseFloat(String(inp.value).replace(/\s/g,"").replace(",","."));
    if(!isFinite(v)||v<0){bad=true;inp.focus();return} const l=lines[+inp.dataset.i]; l.issued=v; l.issuedBy=S.name; l.issuedAt=Date.now()});
  if(bad){toast("Провери ги количините");return}
  const all=lines.every(l=>l.issued!=null);
  const upd={lines}; if(all){upd.status="issued";upd.issuedAt=Date.now();upd.issuedBy=S.name}
  S.fs.doc("orders/"+id).update(upd).catch(()=>toast("Не се зачува. Пробај пак."));
  toast(all?"Нарачката е издадена":"Зачувано за овој магацин");
}

/* ---- ИСПОРАКА ---- */
function rDel(){
  const el=$("#tab-del");
  const list=sortOrders(S.orders.filter(o=>o.status==="issued"));
  if(!list.length){el.innerHTML='<div class="empty"><b>Нема ништо за испорака</b>Тука се нарачките што магацинот ги издал, а уште не се однесени.</div>';return}
  el.innerHTML=list.map(o=>`<div class="order${o.urgent?" urgent":""}"><div class="ohead"><b>${esc(o.sector)}</b>${o.urgent?'<span class="tag urg">ИТНО</span>':""}<span class="tag">${esc(o.no)}</span><span class="meta">издадено ${tStr(o.issuedAt)}, ${esc(o.issuedBy||"")}</span></div>
    ${o.lines.map(l=>`<div class="oline"><div><div class="code">${esc(l.code)}</div><div class="desc">${esc(l.name)}</div></div><div class="qty">${fmt(l.issued??0)} <span class="unit">${esc(l.unit)}</span>${l.issued!==l.qty?`<div class="meta">побарано ${fmt(l.qty)}</div>`:""}</div></div>`).join("")}
    <div class="ofoot"><button class="btn okb" data-dl="${o.id}" style="flex:1">Испорачано на линија</button></div></div>`).join("");
  el.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{S.fs.doc("orders/"+b.dataset.dl).update({status:"delivered",deliveredAt:Date.now(),deliveredBy:S.name}).catch(()=>toast("Не се зачува."));toast("Испорачано")});
}

/* ---- ИЗВЕШТАЈ ---- */
function rRep(){
  const el=$("#tab-rep");
  const d0=new Date(S.repDate+"T00:00:00").getTime(), d1=d0+864e5;
  const list=S.orders.filter(o=>o.createdAt>=d0&&o.createdAt<d1).sort((a,b)=>a.createdAt-b.createdAt);
  const st={new:"нова",issued:"издадена",delivered:"испорачана"};
  el.innerHTML=`<div class="card"><label class="field"><span>Датум</span><input type="date" id="rd" value="${S.repDate}"></label>
    <div class="btns"><button class="btn" id="xls">Симни Excel за NAV</button></div>
    <p class="meta" style="margin:10px 0 0">Excel има три листа: Трансфер (по прирачен), Минус (по магацин) и Сите (со времиња). Во NAV се префрла само издаденото.</p></div>
    <h2>Нарачки на ${new Date(d0).toLocaleDateString("mk-MK")} (${list.length})</h2>
    ${list.length?`<div class="list">${list.map(o=>`<div class="row"><div class="main"><div class="code">${esc(o.sector)} <span class="tag">${esc(o.no)}</span>${o.urgent?'<span class="tag urg">ИТНО</span>':""}</div>
      <div class="meta">нарачано ${tStr(o.createdAt)}${o.issuedAt?` · издадено за ${mins(o.createdAt,o.issuedAt)} мин`:""}${o.deliveredAt?` · испорачано за ${mins(o.createdAt,o.deliveredAt)} мин`:""}</div></div>
      <span class="tag ${o.status==="delivered"?"ok":""}">${st[o.status]||o.status}</span></div>`).join("")}</div>`:'<div class="empty">Нема нарачки за тој ден.</div>'}`;
  $("#rd").onchange=e=>{S.repDate=e.target.value||S.repDate;render()};
  $("#xls").onclick=()=>exportX(list);
}
function exportX(list){
  if(!list.length){toast("Нема нарачки");return}
  const tr=[["Прирачен","Од магацин","Шифра","Назив","Количина","Мерка","Нарачка","Сектор"]], mi=[["Магацин","ТЦ","Шифра","Назив","Количина","Мерка","Нарачка","Сектор"]];
  const all=[["Нарачка","Сектор","Итно","Нарачал","Нарачано","Шифра","Назив","Од","Начин","Побарано","Издадено","Мерка","Издал","Издадено во","Испорачано во","Мин. до издавање","Мин. до испорака","Статус"]];
  const T=[],M=[];
  for(const o of list) for(const l of o.lines){
    all.push([o.no,o.sector,o.urgent?"Да":"",o.byName,tStr(o.createdAt),l.code,l.name,l.od,l.nacin,l.qty,l.issued??"",l.unit,l.issuedBy||"",tStr(l.issuedAt||o.issuedAt),tStr(o.deliveredAt),mins(o.createdAt,l.issuedAt||o.issuedAt)??"",mins(o.createdAt,o.deliveredAt)??"",o.status]);
    if(l.issued==null||l.issued<=0) continue;
    if(l.nacin==="Минус") M.push([l.od,o.tc,l.code,l.name,l.issued,l.unit,o.no,o.sector]);
    else T.push([l.kon,l.od,l.code,l.name,l.issued,l.unit,o.no,o.sector]);
  }
  T.sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||String(a[1]).localeCompare(String(b[1])));
  M.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  const wb=XLSX.utils.book_new();
  const add=(rows,name,w)=>{const s=XLSX.utils.aoa_to_sheet(rows);s["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,s,name)};
  add(tr.concat(T),"Трансфер",[10,10,12,36,10,9,11,14]); add(mi.concat(M),"Минус",[9,7,12,36,10,9,11,14]);
  add(all,"Сите",[11,14,6,16,15,12,30,6,9,9,9,8,14,15,15,9,9,10]);
  XLSX.writeFile(wb,"Narachki_"+S.repDate+".xlsx");
}

/* ---------- scanning ---------- */
let detector=null; try{if("BarcodeDetector" in window)detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){}
const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
let flip=0;
function jsqrRegion(src,sx,sy,sw,sh,maxPx,inv){
  const sc=Math.min(1,maxPx/Math.max(sw,sh)); cv.width=Math.max(1,Math.round(sw*sc)); cv.height=Math.max(1,Math.round(sh*sc));
  cx.drawImage(src,sx,sy,sw,sh,0,0,cv.width,cv.height);
  const d=cx.getImageData(0,0,cv.width,cv.height);
  const r=jsQR(d.data,d.width,d.height,{inversionAttempts:inv}); return r?r.data:null;
}
async function decodeSource(src,w,h,still){
  const m=Math.min(w,h), cs=Math.round(m*0.7), cx0=Math.round((w-cs)/2), cy0=Math.round((h-cs)/2);
  if(detector){
    try{const r=await detector.detect(src);if(r&&r[0])return r[0].rawValue}catch(e){}
    try{ const sc=Math.min(2,1200/cs); cv.width=Math.round(cs*sc); cv.height=Math.round(cs*sc);
      cx.drawImage(src,cx0,cy0,cs,cs,0,0,cv.width,cv.height);
      const r2=await detector.detect(cv); if(r2&&r2[0]) return r2[0].rawValue; }catch(e){}
  }
  if(!window.jsQR) return null;
  if(still){
    return jsqrRegion(src,cx0,cy0,cs,cs,1000,"attemptBoth")||jsqrRegion(src,0,0,w,h,1400,"attemptBoth");
  }
  flip=(flip+1)%3;
  if(flip<2) return jsqrRegion(src,cx0,cy0,cs,cs,720,"dontInvert");
  return jsqrRegion(src,0,0,w,h,960,"dontInvert");
}
async function startScan(){
  if(!S.liveOk){$("#photoIn").click();return}
  $("#cam").classList.add("open"); $("#camInfo").textContent=""; $("#camMsg").textContent="QR-кодот стави го во белата рамка, на 10–20 cm од камерата";
  try{
    const camId=store.get("popis-cam");
    const base={width:{ideal:1920},height:{ideal:1080}};
    try{
      S.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:camId?{...base,deviceId:{exact:camId}}:{...base,facingMode:{ideal:"environment"}}});
    }catch(err){
      if(!camId) throw err; store.set("popis-cam","");
      S.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{...base,facingMode:{ideal:"environment"}}});
    }
    try{
      const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
      const back=devs.filter(d=>!/front|предн|user|selfie/i.test(d.label));
      S.cams=back.length?back:devs;
    }catch(e){S.cams=[]}
    $("#camSwitch").hidden=!(S.cams&&S.cams.length>1);
    const tr=S.stream.getVideoTracks()[0];
    try{const caps=tr.getCapabilities?tr.getCapabilities():{}; if(caps.focusMode&&caps.focusMode.includes("continuous")) await tr.applyConstraints({advanced:[{focusMode:"continuous"}]});}catch(e){}
    S.track=tr; S.torch=false; S.zoom=1;
    try{const caps=tr.getCapabilities?tr.getCapabilities():{};
      $("#camTorch").hidden=!caps.torch; $("#camTorch").textContent="Светло";
      if(caps.zoom&&caps.zoom.max>=2){ S.zoomMax=Math.min(3,caps.zoom.max); $("#camZoom").hidden=false; $("#camZoom").textContent="Зум 2×"; } else $("#camZoom").hidden=true;
    }catch(e){}
    const v=$("#video"); v.srcObject=S.stream; await v.play(); S.scanning=true;
    setTimeout(()=>{ if(!S.scanning) return; const st=S.track&&S.track.getSettings?S.track.getSettings():{}; const ix=(S.cams||[]).findIndex(c=>c.deviceId===st.deviceId);
      $("#camInfo").textContent=`камера ${ix>=0?ix+1:"?"}/${(S.cams||[]).length||1}, ${v.videoWidth}×${v.videoHeight}, ${detector?"BD":"JS"}`; },800);
    loop();
  }catch(e){
    $("#camInfo").textContent=(e&&e.name)||"";
    S.liveOk=false; render();
    $("#camMsg").textContent="Камерата во живо не е дозволена. Провери дали си дозволил пристап до камера, или притисни „Сликај“.";
  }
}
async function loop(){
  if(!S.scanning) return; const v=$("#video");
  if(v.readyState>=2&&v.videoWidth){const r=await decodeSource(v,v.videoWidth,v.videoHeight);
    if(r&&S.scanning){if(navigator.vibrate)try{navigator.vibrate(80)}catch(e){} stopScan(); onScan(r); return}}
  setTimeout(()=>requestAnimationFrame(loop),60);
}
function stopScan(){S.scanning=false;if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}$("#video").srcObject=null;$("#cam").classList.remove("open")}
$("#camSwitch").onclick=async()=>{
  if(!S.cams||S.cams.length<2) return;
  const st=S.track&&S.track.getSettings?S.track.getSettings():{};
  const ix=S.cams.findIndex(c=>c.deviceId===st.deviceId);
  const next=S.cams[(ix+1)%S.cams.length];
  store.set("popis-cam",next.deviceId);
  stopScan(); setTimeout(startScan,150);
};
$("#camTorch").onclick=async()=>{ if(!S.track) return; S.torch=!S.torch;
  try{await S.track.applyConstraints({advanced:[{torch:S.torch}]}); $("#camTorch").textContent=S.torch?"Светло ✓":"Светло";}catch(e){} };
$("#camZoom").onclick=async()=>{ if(!S.track) return; S.zoom=S.zoom===1?2:1;
  try{await S.track.applyConstraints({advanced:[{zoom:S.zoom}]}); $("#camZoom").textContent=S.zoom===1?"Зум 2×":"Зум 1×";}catch(e){} };
$("#video").onclick=async()=>{ if(!S.track) return; try{await S.track.applyConstraints({advanced:[{focusMode:"single-shot"}]}); await S.track.applyConstraints({advanced:[{focusMode:"continuous"}]});}catch(e){} };
$("#camClose").onclick=stopScan; $("#camManual").onclick=manualEntry; $("#camPhoto").onclick=()=>$("#photoIn").click();
$("#photoIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=async()=>{const r=await decodeSource(img,img.naturalWidth,img.naturalHeight,true);URL.revokeObjectURL(url);
    if(r){stopScan();onScan(r)}else toast("QR-кодот не се гледа на сликата. Сликај одблиску.")};
  img.src=url;};



render();
})();
</script>
